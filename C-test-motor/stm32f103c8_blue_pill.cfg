# STM32F103RCT6 (256 KB Flash / 48 KB RAM) + ST-Link
# 供 CLion "OpenOCD 下载并运行" 使用
#
# 原文件只 source 了 target、没有指定调试器，OpenOCD 找不到任何可用的
# transport，于是报：Error: unable to select a session transport.

# ---------- 1. 调试器 ----------
# stlink.cfg 在 OpenOCD 0.12 里统一了 V1 / V2 / V2-1 / V3，vid_pid 全部覆盖
source [find interface/stlink.cfg]
transport select swd

# ---------- 2. 目标芯片 ----------
# 不设 FLASH_SIZE，让 OpenOCD 读芯片寄存器自动识别容量
# （原来的 set FLASH_SIZE 0x20000 是按 C8 的 128 KB 写死的，对 RCT6 是错的）
source [find target/stm32f1x.cfg]

# ---------- 3. 时钟 ----------
# 必须放在 target 之后，否则会被 target 配置里的默认值覆盖
# 杜邦线较长或连接不稳时，把 4000 依次降到 1800 / 1000
adapter speed 4000

# ---------- 4. 备用开关 ----------
# 如果下载成功但程序不自动运行，且 NRST 已接到 ST-Link，取消下面这行注释：
# reset_config srst_only srst_nogate
